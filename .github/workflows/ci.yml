name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, security-admin-dashboard-hardening]
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Audit production dependencies for high and critical advisories
        run: npm audit --omit=dev --audit-level=high
      - name: Lint the full repository
        run: npm run lint
      - name: Regression tests
        run: npm test
      - name: Production build
        run: npm run build
