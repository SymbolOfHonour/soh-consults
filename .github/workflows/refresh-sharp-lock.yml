name: Refresh Sharp lockfile
on:
  push:
    branches:
      - chore/trigger-cloudflare-main
permissions:
  contents: write
jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/trigger-cloudflare-main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate lockfile
        run: npm install --package-lock-only
      - name: Verify clean install and audit
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
      - name: Commit regenerated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "fix: regenerate lockfile for Sharp 0.35.5"
          git push origin HEAD:chore/trigger-cloudflare-main
