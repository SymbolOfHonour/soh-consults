name: Patch CGPA complete target report

on:
  push:
    paths:
      - '.github/workflows/patch-cgpa-report.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cgpa-complete-target-report
      - name: Apply report patch
        run: python scripts/patch-cgpa-report.py
      - name: Commit report fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/cgpa-calculator/planner/page.tsx
          git commit -m "Fix complete Target CGPA report export"
          git push origin HEAD:fix/cgpa-complete-target-report
