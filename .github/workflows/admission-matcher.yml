name: Admission Matcher
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  matcher:
    if: github.head_ref == 'feature/admission-matcher-beta'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Protect every existing file outside the Matcher
        env:
          MATCHER_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          node - <<'JS'
          const {execFileSync}=require('node:child_process');
          const files=execFileSync('git',['diff','--name-only',process.env.MATCHER_BASE_SHA,'HEAD'],{encoding:'utf8'}).trim().split('\n').filter(Boolean);
          const outside=files.filter(p=>!p.startsWith('app/admission-matcher/')&&!p.startsWith('lib/admission-matcher/')&&!/^tests\/admission-matcher.*\.cjs$/.test(p)&&p!=='.github/workflows/admission-matcher.yml');
          if(outside.length)throw new Error('Matcher must not modify existing calculators or unrelated files: '+outside.join(', '));
          console.log('All '+files.length+' changed paths are isolated to the Matcher.');
          JS
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Capture current LASU official requirements
        run: node tests/admission-matcher-lasu-snapshot.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: lasu-live-requirements
          path: lasu-live-requirements.json
      - name: Lint Matcher implementation and regression tests
        run: npx eslint app/admission-matcher lib/admission-matcher tests/admission-matcher*.cjs
      - name: Execute Matcher behavioural and data regression tests
        run: node --test tests/admission-matcher*.test.cjs
