name: Cloudflare QA Build

on:
  push:
    branches:
      - qa/production-readiness
      - feature/ask-soh-v2-verified-rag
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-qa-deployment
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/qa/production-readiness' || github.ref == 'refs/heads/feature/ask-soh-v2-verified-rag'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout isolated QA source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies for Cloudflare QA
        run: npm install --no-audit --no-fund

      - name: Build OpenNext for Cloudflare
        run: npm run build:cloudflare

      - name: Verify Ask S.O.H QA API
        shell: bash
        run: |
          response=$(curl --fail-with-body --retry 3 --retry-delay 3 --max-time 45 --get 'https://soh-consults-qa.oluyepeadetayo.workers.dev/api/ask-soh/search' --data-urlencode 'q=What is LASU cutoff mark?')
          RESPONSE="$response" node -e 'const x=JSON.parse(process.env.RESPONSE); const summary={answer:x.answer,confidence:x.confidence,sourceType:x.sourceType||null,intent:x.intent||null,answerMode:x.answerMode||null,results:Array.isArray(x.results)?x.results.length:null}; console.log(JSON.stringify(summary)); if(x.answer!=="195"||x.sourceType!=="official_live"||typeof x.confidence!=="string"||!Array.isArray(x.results)) process.exit(1);'
