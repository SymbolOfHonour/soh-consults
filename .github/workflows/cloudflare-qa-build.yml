name: Cloudflare QA Build

on:
  push:
    branches:
      - qa/production-readiness
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-qa-deployment
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/qa/production-readiness'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout QA branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies for Cloudflare QA
        run: npm install --no-audit --no-fund

      - name: Build OpenNext for Cloudflare
        run: npm run build:cloudflare

      - name: Deploy Cloudflare QA Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
